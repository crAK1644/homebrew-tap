name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      matrix:
        # arm64 macOS only.
        #
        # The Linux leg the tap-new template ships needs a container with
        # `--privileged`, expressed as a job-level `options:` key that Actions
        # rejects outright -- every run failed before a job started.
        #
        # macos-15-intel builds nothing: "orchestrator-mcp-server has unbottled
        # dependencies, so a bottle will not be built". homebrew-core no longer
        # bottles this tree for x86, so the leg is a guaranteed skip.
        #
        # Both platforms can still build from source.
        os: [ macos-26 ]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        # SHA-pinned: this artifact is the bottle `brew pr-pull` later publishes, so
        # a moved tag here would move what ships.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bottles_${{ matrix.os }}
          # test-bot runs each step with the tap checkout as its working
          # directory, so that is where the bottles land -- not the workspace the
          # template's bare glob searches, which uploaded nothing.
          path: ${{ steps.set-up-homebrew.outputs.repository-path }}/*.bottle.*
